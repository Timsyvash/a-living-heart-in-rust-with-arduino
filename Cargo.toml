[package]
name = "a-living-heart-in-rust-with-arduino"
version = "0.1.0"
authors = ["Timofey Syvash <timofey.syvash@gmail.com>"]
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "a-living-heart-in-rust-with-arduino"
test = false
bench = false

[dependencies]
panic-halt = "0.2"
smart-leds = "0.3.0"
ws2812-spi = { version = "0.4.0", default-features = false }

arduino-hal = { path = "./avr-hal/avr-hal-main/arduino-hal", features = ["arduino-mega2560"] }
critical-section = "1.2.0"

[profile.dev]
panic = "abort"
lto = true
opt-level = "s"

[profile.release]
panic = "abort"
codegen-units = 1
debug = true
lto = true
opt-level = "s"
